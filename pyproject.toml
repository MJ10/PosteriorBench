[project]
name = "posteriorbench"
dynamic = ["version"]
description = "Benchmark code for PosteriorBench, a benchmark for sampling rare behaviors of language models."
readme = "README.md"
requires-python = ">=3.11"
# The code is MIT. The two tables in posteriorbench/dataset are part of the dataset and are
# released under ODC-By 1.0.
license = "MIT AND ODC-By-1.0"
license-files = ["LICENSE", "posteriorbench/dataset/LICENSE"]
authors = [{ name = "Transluce" }]
keywords = ["benchmark", "language models", "posterior sampling", "rare behaviors"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Version ranges. The versions the package is tested with are in uv.lock (`uv sync`).
dependencies = [
    "huggingface-hub>=1.5",
    "numpy>=2.1",
    "pyarrow>=18",
    "torch>=2.11",
    "transformers>=5.13.1,<6",
    "typer>=0.16",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "isort==5.12.0",
    "pyright>=1.1",
    "pytest>=8",
]

[project.scripts]
posteriorbench = "posteriorbench.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "posteriorbench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["posteriorbench"]

[tool.hatch.build.targets.sdist]
include = [
    "/posteriorbench",
    "/tests",
    "/tools",
    "/examples",
    "/docs",
]

[tool.uv]
# The numpy version the package is tested with.
constraint-dependencies = ["numpy==2.3.5"]

# On Linux the lock takes torch from the CUDA 12.8 index: the torch 2.11 wheel on PyPI is a
# CUDA 13.0 build, which needs a newer driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[tool.pyright]
include = ["posteriorbench", "tests", "examples", "tools"]
extraPaths = ["tools", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ holds scripts that are not part of the installed package; some tests import them.
pythonpath = ["tools"]
markers = [
    "real_model: needs the real Qwen3.5-0.8B (skipped unless POSTERIORBENCH_REAL_MODEL is set)",
]

# methods/ is a project of its own, with its own configuration of these tools.
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "^/methods/"

[tool.isort]
profile = "black"
line_length = 100
# Fixed classification, so isort gives the same result whether or not the package is installed.
known_first_party = ["posteriorbench"]
extend_skip = ["methods"]


###  --------------   CLUV CONFIG   --------------  ###
# Running on the Mila and DRAC/PAICE clusters with cluv (https://github.com/mila-iqia/cluv).
# How to use it: CLUSTERS.md. Reference: https://mila-iqia.github.io/cluv/.

[tool.cluv]
# All variables below can be overridden per cluster.

# Job script used when `cluv submit` isn't given one. scripts/methods_job.sh is for methods/.
job_script_path = "scripts/job.sh"

# Where jobs write their Slurm log and results (one folder per job: <cluster>_<job id>).
# `cluv sync` copies new results back to the `logs` symlink of your local project.
results_path = "$SCRATCH/logs/posteriorbench"
results_symlink = "logs"

## The path where the project is cloned on clusters (default: same path relative to $HOME as here).
# project_dir = "$HOME/<project_name>"

[tool.cluv.env]
# Environment variables of the jobs, on all clusters.
# Compute nodes of most DRAC/PAICE clusters have no internet: uv, the Hub and wandb run offline.
# scripts/setup_cluster.sh installs the environments and downloads the model and the corpus hits
# into HF_HOME beforehand, on a login node.
UV_OFFLINE = "1"
HF_HUB_OFFLINE = "1"
WANDB_MODE = "offline"
HF_HOME = "$SCRATCH/.cache/huggingface"   # also set in scripts/setup_cluster.sh
# The job scripts write results to $PB_RESULTS_PATH/<cluster>_<job id>: keep it equal to results_path.
PB_RESULTS_PATH = "$SCRATCH/logs/posteriorbench"
# Output roots of methods/ runs (checkpoints, up to 165 GB a run). Not copied back by `cluv sync`.
PB_WORK_PATH = "$SCRATCH/posteriorbench/runs"

[tool.cluv.local]
# Fake "$SCRATCH" directory to use when not on a Slurm cluster.
env = { SCRATCH = "$HOME/scratch" }

[tool.cluv.sbatch_args]
# sbatch flags applied on all clusters. The job scripts set cpus, memory and time; flags given to
# `cluv submit` override both. `--vram=20GB` on the command line also races MIG slices on DRAC.
requeue = true
gpus = "1"

###  --------------   Clusters Config   --------------  ###
# Remove a cluster's table, or `cluv disable <cluster>`, to stop using it.
# With more than one allocation on a cluster, a list of sbatch_args submits one job per allocation
# and keeps the first one that starts.

[tool.cluv.clusters.mila]
# https://docs.mila.quebec/technical_reference/clusters/mila/
# Compute nodes have internet access.
env = { UV_OFFLINE = "0", HF_HUB_OFFLINE = "0", WANDB_MODE = "online" }

[tool.cluv.clusters.tamia]
# https://docs.alliancecan.ca/wiki/TamIA
# GPUs only come as whole nodes (4 H100s); scripts/benchmark.py runs one worker per GPU.
sbatch_args = { account = "aip-bengioy", gpus = "h100:4", cpus-per-task = 16, mem = "0" }

[tool.cluv.clusters.killarney]
# https://docs.alliancecan.ca/wiki/Killarney
# Jobs can't be submitted from /home, so the project lives on $SCRATCH.
project_dir = "$SCRATCH/repos/PosteriorBench"
sbatch_args = { account = "aip-bengioy" }

[tool.cluv.clusters.vulcan]
# https://docs.alliancecan.ca/wiki/Vulcan
sbatch_args = { account = "aip-bengioy" }

[tool.cluv.clusters.rorqual]
# https://docs.alliancecan.ca/wiki/Rorqual
sbatch_args = [{ account = "rrg-bengioy-ad" }, { account = "def-bengioy" }]

[tool.cluv.clusters.fir]
# https://docs.alliancecan.ca/wiki/Fir
env = { UV_OFFLINE = "0", HF_HUB_OFFLINE = "0", WANDB_MODE = "online" }
sbatch_args = [{ account = "rrg-bengioy-ad" }, { account = "def-bengioy" }]

[tool.cluv.clusters.nibi]
# https://docs.alliancecan.ca/wiki/Nibi
env = { UV_OFFLINE = "0", HF_HUB_OFFLINE = "0", WANDB_MODE = "online" }
sbatch_args = [{ account = "rrg-bengioy-ad" }, { account = "def-bengioy" }]

[tool.cluv.clusters.trillium-gpu]
# https://docs.alliancecan.ca/wiki/Trillium
# $HOME isn't mounted on compute nodes, so the project lives on $SCRATCH.
project_dir = "$SCRATCH/repos/PosteriorBench"
sbatch_args = { account = "rrg-bengioy-ad" }

[tool.cluv.clusters.narval]
# https://docs.alliancecan.ca/wiki/Narval
sbatch_args = { account = "def-bengioy" }  # Mila doesn't have an allocation on Narval anymore.
